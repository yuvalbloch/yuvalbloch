# Builds the Hugo site in quickstart/ and publishes it to the gh-pages branch,
# which is what GitHub Pages serves for yuvalbloch.com.
#
# Note: the Hugo site root is quickstart/, NOT the repository root. Every step
# that runs Hugo must set working-directory accordingly, and publish_dir must
# point at quickstart/public.
name: Deploy Hugo site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes a commit to the gh-pages branch, so the
# token needs write access to repository contents.
permissions:
  contents: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # themes/ananke is a git submodule; without this the build fails.
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          # Pinned to the version the site is developed against. The theme needs
          # the extended build for Sass (css.Sass, LibSass — Dart Sass not required).
          hugo-version: '0.147.7'
          extended: true

      - name: Build
        working-directory: ./quickstart
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify

      - name: Verify CNAME survived the build
        working-directory: ./quickstart
        run: |
          test -f public/CNAME || {
            echo "::error::public/CNAME is missing — publishing would drop the custom domain."
            exit 1
          }
          echo "CNAME: $(cat public/CNAME)"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./quickstart/public
          # Belt and braces: peaceiris rewrites CNAME even if the build lost it.
          cname: yuvalbloch.com
