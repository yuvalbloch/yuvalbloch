{{/*
  Small line icons for the Wild West section. Call with a name string:
  {{ partials.Include "wild-west/icon.html" "compass" }}
*/}}
{{- $name := . | default "star" -}}
<svg class="ww-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{{- if eq $name "compass" }}
  <circle cx="12" cy="12" r="9"/>
  <path d="M15.5 8.5l-2 5-5 2 2-5z"/>
  <path d="M12 3v1.5M12 19.5V21M3 12h1.5M19.5 12H21"/>
{{- else if eq $name "chip" }}
  <rect x="6" y="6" width="12" height="12" rx="1.5"/>
  <rect x="9.5" y="9.5" width="5" height="5" rx=".5"/>
  <path d="M9 3v3M12 3v3M15 3v3M9 18v3M12 18v3M15 18v3M3 9h3M3 12h3M3 15h3M18 9h3M18 12h3M18 15h3"/>
{{- else }}
  <path d="M12 2.5l2.2 5.6 5.8.4-4.5 3.7 1.5 5.8L12 14.8 7 18l1.5-5.8L4 8.5l5.8-.4z"/>
{{- end }}
</svg>
